name: ActiveRecord Task Store PostgreSQL

on:
  push:
    branches: [main]
    paths:
      - "lib/a2a/rails/task/**"
      - "lib/a2a/rails/configuration.rb"
      - "lib/tasks/**"
      - "spikes/active_record_store_postgres/**"
      - ".github/workflows/task-store-postgres.yml"
      - "a2a-rails.gemspec"
      - "lib/a2a/rails/version.rb"
      - "lib/a2a/rails/version.rb"
  pull_request:
    paths:
      - "lib/a2a/rails/task/**"
      - "lib/a2a/rails/configuration.rb"
      - "lib/tasks/**"
      - "spikes/active_record_store_postgres/**"
      - ".github/workflows/task-store-postgres.yml"
      - "a2a-rails.gemspec"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-task-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/a2a_rails_test

    defaults:
      run:
        working-directory: spikes/active_record_store_postgres

    steps:
      - uses: actions/checkout@v4
      - name: Start preinstalled PostgreSQL 16 on Ubuntu 24.04 runner
        shell: bash
        run: |
          set -euo pipefail
          pg_config --version
          pg_config --version | grep -Eq '^PostgreSQL 16[.]'
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='a2a_rails_test'" | grep -qx 1; then
            sudo -u postgres createdb a2a_rails_test
          fi
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=a2a_rails_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          pg_isready -h 127.0.0.1 -U postgres -d a2a_rails_test


      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          working-directory: spikes/active_record_store_postgres
          bundler-cache: true

      - name: Run PostgreSQL persistence and locking smoke
        run: bundle exec ruby smoke.rb
