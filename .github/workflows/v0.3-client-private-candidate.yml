name: Step 31-5 private stable 0.3.0 exact-installed candidate

on:
  pull_request:
    paths:
      - ".github/workflows/v0.3-client-private-candidate.yml"
      - "a2a-rails.gemspec"
      - "lib/**"
      - "app/**"
      - "config/**"
      - "test/support/client_only_rails_smoke.rb"
      - "test/support/production_security_http_smoke.rb"
      - "spikes/clean_host_postgres/**"
      - "spikes/a2a_client_v03/**"
      - "docs/release/**"
      - "CHANGELOG.md"
  push:
    branches: [main, candidate/v0.3.0-stable]
    paths:
      - ".github/workflows/v0.3-client-private-candidate.yml"
      - "a2a-rails.gemspec"
      - "lib/**"
      - "app/**"
      - "config/**"
      - "test/support/client_only_rails_smoke.rb"
      - "test/support/production_security_http_smoke.rb"
      - "spikes/clean_host_postgres/**"
      - "spikes/a2a_client_v03/**"
      - "docs/release/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

# PRE-PUBLICATION CI artifact ONLY. No Gem push/tag/Release.
# Check out PR head commit (not synthetic merge); archive once, build once.
env:
  RC_VERSION: "0.3.0"
  RC_FILENAME: "a2a-rails-0.3.0.gem"
  RC_ARTIFACT: "a2a-rails-0.3.0-stable-candidate-ci-only"

jobs:
  build-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - name: Build from immutable checkout, with no staging delta for genuine stable candidate source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_version="$(ruby -Ilib -ra2a/rails/version -e 'print A2A::Rails::VERSION')"
          mkdir -p "$RUNNER_TEMP/rc-source" "$RUNNER_TEMP/rc-package"
          git archive "$source_sha" | tar -xf - -C "$RUNNER_TEMP/rc-source"

          test "$source_version" = "$RC_VERSION" || {
            echo "Candidate must contain actual stable VERSION=$RC_VERSION"; exit 1;
          }
          test "$source_sha" = "${{ github.event.pull_request.head.sha || github.sha }}" || {
            echo "Unexpected source SHA (synthetic PR merge disallowed)"; exit 1;
          }
          echo "NONE: exact source, no staging edit" > "$RUNNER_TEMP/rc-package/STAGING_DELTA"
          (
            cd "$RUNNER_TEMP/rc-source"
            gem build a2a-rails.gemspec --output "$RUNNER_TEMP/rc-package/$RC_FILENAME"
          )
          test -f "$RUNNER_TEMP/rc-package/$RC_FILENAME"
          ruby -rrubygems/package -rdigest -rtmpdir - "$RUNNER_TEMP/rc-package/$RC_FILENAME" <<'RUBY'
          path = ARGV.fetch(0)
          spec = Gem::Package.new(path).spec
          abort "not an exact stable candidate Gem" unless spec.name == "a2a-rails" &&
            spec.version.to_s == "0.3.0" &&
            spec.required_ruby_version.satisfied_by?(Gem::Version.new("3.3.0"))
          Dir.mktmpdir do |dir|
            Gem::Package.new(path).extract_files(dir)
            mandatory = %w[
              lib/a2a/rails/version.rb
              lib/a2a/rails/client.rb
              lib/a2a/rails/client/agent_card_resolver.rb
              lib/a2a/rails/client/outbound_policy.rb
              lib/a2a/rails/client/pinned_https_transport.rb
              lib/a2a/rails/engine.rb
              README.md
              CHANGELOG.md
            ]
            abort "missing packaged essentials" unless (mandatory - spec.files).empty?
            abort "empty Gem file manifest" if spec.files.empty?
            spec.files.each do |relative|
              abort "unexpected file in Gem: #{relative}" unless
                relative.match?(%r{\A(?:lib/|app/|config/|README\.md\z|CHANGELOG\.md\z|LICENSE\z)})
              origin = File.join(ENV.fetch("GITHUB_WORKSPACE"), relative)
              packaged = File.join(dir, relative)
              abort "missing or differing packaged source: #{relative}" unless
                File.file?(origin) && File.file?(packaged) &&
                Digest::SHA256.file(origin).hexdigest == Digest::SHA256.file(packaged).hexdigest
            end
            puts "PASS exact matching packaged files: #{spec.files.size}"
            abort "wrong version within package" unless
              File.read(File.join(dir, "lib/a2a/rails/version.rb")).include?('VERSION = "0.3.0"')
          end
          puts "PASS: packaged Client/Server source bytes and stable-candidate metadata match expected input"
          RUBY
          (
            cd "$RUNNER_TEMP/rc-package"
            sha256sum "$RC_FILENAME" > SHA256SUMS
            printf '%s\n' "$source_sha" > SOURCE_COMMIT
            test -s STAGING_DELTA
            cat SHA256SUMS
            cat SOURCE_COMMIT
          )
      - name: Upload one immutable run-scoped candidate for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: |
            ${{ runner.temp }}/rc-package/a2a-rails-0.3.0.gem
            ${{ runner.temp }}/rc-package/SHA256SUMS
            ${{ runner.temp }}/rc-package/SOURCE_COMMIT
            ${{ runner.temp }}/rc-package/STAGING_DELTA
          if-no-files-found: error
          retention-days: 30

  installed-client:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["~> 8.0.0", "~> 8.1.0"]
    env:
      TARGET_RAILS: ${{ matrix.rails }}
      A2A_RAILS_EXPECTED_VERSION: "0.3.0"
      A2A_RAILS_USE_INSTALLED_GEM: "1"
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
      RAILS_ENV: production
      RACK_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: ${{ runner.temp }}/rc
      - name: Verify exact build-once artifact before installation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          gem install --no-document "./$RC_FILENAME"
          gem install --no-document rails -v "$TARGET_RAILS"
          mkdir -p "$RUNNER_TEMP/clean-client-host"
          cat > "$RUNNER_TEMP/clean-client-host/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "rails", "$TARGET_RAILS"
          gem "a2a-rails", "= $RC_VERSION"
          GEMFILE
          BUNDLE_GEMFILE="$RUNNER_TEMP/clean-client-host/Gemfile" bundle install --local
      - name: Require exact installed RC and verify Client-only Rails boot
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_GEMFILE="$RUNNER_TEMP/clean-client-host/Gemfile"
          bundle exec ruby -e '
            require "rails"
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            abort "wrong RC version" unless A2A::Rails::VERSION == ENV.fetch("RC_VERSION")
            abort "loaded source checkout" if File.realpath(spec.full_gem_path).start_with?(
              File.realpath(ENV.fetch("GITHUB_WORKSPACE")) + File::SEPARATOR)
            abort "Client missing from installed RC" unless defined?(A2A::Rails::Client)
            puts "PASS installed isolated RC #{spec.full_gem_path} Rails #{Rails.version}"
          '
          bundle exec ruby "$GITHUB_WORKSPACE/test/support/client_only_rails_smoke.rb"
      - name: Verify fail-closed production Server security from same installed RC
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_GEMFILE="$RUNNER_TEMP/clean-client-host/Gemfile"
          bundle exec ruby "$GITHUB_WORKSPACE/test/support/production_security_http_smoke.rb"

  installed-postgres:
    needs: build-once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 8.0.0", "~> 8.1.0"]
        inflection: ["default", "acronym"]
    env:
      TARGET_RAILS: ${{ matrix.rails }}
      A2A_TEST_INFLECTION: ${{ matrix.inflection }}
      A2A_RAILS_EXPECTED_VERSION: "0.3.0"
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/a2a_rails_test
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: step-29-5r-test-only-production-shape-key
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Start preinstalled PostgreSQL 16 on Ubuntu 24.04 runner
        shell: bash
        run: |
          set -euo pipefail
          pg_config --version
          pg_config --version | grep -Eq '^PostgreSQL 16[.]'
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='a2a_rails_test'" | grep -qx 1; then
            sudo -u postgres createdb a2a_rails_test
          fi
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=a2a_rails_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          pg_isready -h 127.0.0.1 -U postgres -d a2a_rails_test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: ${{ runner.temp }}/rc
      - name: Verify same immutable RC Gem and run independent installed PG host
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "CANDIDATE_GEM_SHA256=$(sha256sum "$RC_FILENAME" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          gem install --no-document "./$RC_FILENAME"
          gem install --no-document rails -v "$TARGET_RAILS"
          pg_config --version
      - name: Verify installed RC clean Rails/PostgreSQL migration, restart, race and prune
        env:
          CANDIDATE_GEM_FILE: ${{ runner.temp }}/rc/a2a-rails-0.3.0.gem
        run: ruby spikes/clean_host_postgres/smoke.rb

  installed-official-sdk:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent: [python, go]
    env:
      STEP29_5B_AGENT: ${{ matrix.agent }}
      AGENT_HOST: ${{ matrix.agent }}-agent.test
      AGENT_PORT: ${{ matrix.agent == 'python' && '3444' || '3445' }}
      A2A_RAILS_EXPECTED_VERSION: "0.3.0"
      A2A_RAILS_USE_INSTALLED_GEM: "1"
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - uses: actions/setup-python@v5
        if: matrix.agent == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        if: matrix.agent == 'go'
        with:
          go-version: "1.26.0"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: ${{ runner.temp }}/rc
      - name: Install exact staged RC without referencing Gem source checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          gem install --no-document "./$RC_FILENAME"
          gem install --no-document rails -v "~> 8.1.0"
          mkdir -p "$RUNNER_TEMP/isolated-interop-host"
          cat > "$RUNNER_TEMP/isolated-interop-host/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "rails", "~> 8.1.0"
          gem "a2a-rails", "= 0.3.0"
          GEMFILE
          BUNDLE_GEMFILE="$RUNNER_TEMP/isolated-interop-host/Gemfile" bundle install --local
          BUNDLE_GEMFILE="$RUNNER_TEMP/isolated-interop-host/Gemfile" bundle exec ruby -e '
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            abort "wrong RC" unless A2A::Rails::VERSION == ENV.fetch("RC_VERSION")
            abort "checkout was loaded" if File.realpath(spec.full_gem_path).start_with?(
              File.realpath(ENV.fetch("GITHUB_WORKSPACE")) + File::SEPARATOR)
            puts "PASS actual installed Client candidate: #{spec.full_gem_path}"
          '
      - name: Prepare official native Python or Go A2A SDK server
        shell: bash
        run: |
          set -euo pipefail
          if test "$STEP29_5B_AGENT" = python; then
            python -m pip install "a2a-sdk==1.2.2" "uvicorn[standard]" starlette "sse-starlette"
          else
            (cd spikes/a2a_client_v03/go_sdk_https_server && go mod download && go mod tidy && go build -o "$RUNNER_TEMP/official-go-server" .)
          fi
      - name: Generate native HTTPS identity and launch local independent SDK
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/native-test.key" \
            -out "$RUNNER_TEMP/native-test.crt" \
            -subj "/CN=$AGENT_HOST" \
            -addext "subjectAltName=DNS:$AGENT_HOST" >/dev/null 2>&1
          echo "STEP29_5B_CA=$RUNNER_TEMP/native-test.crt" >> "$GITHUB_ENV"
          if test "$STEP29_5B_AGENT" = python; then
            python spikes/a2a_client_v03/python_sdk_https_server.py \
              --certificate "$RUNNER_TEMP/native-test.crt" \
              --key "$RUNNER_TEMP/native-test.key" --port "$AGENT_PORT" \
              > "$RUNNER_TEMP/official-server.log" 2>&1 &
          else
            "$RUNNER_TEMP/official-go-server" \
              --certificate "$RUNNER_TEMP/native-test.crt" \
              --key "$RUNNER_TEMP/native-test.key" --port "$AGENT_PORT" \
              > "$RUNNER_TEMP/official-server.log" 2>&1 &
          fi
          echo "$!" > "$RUNNER_TEMP/official-server.pid"
          for n in $(seq 1 50); do
            if curl --noproxy '*' --fail --silent --show-error \
              --cacert "$RUNNER_TEMP/native-test.crt" \
              --resolve "$AGENT_HOST:$AGENT_PORT:127.0.0.1" \
              "https://$AGENT_HOST:$AGENT_PORT/.well-known/agent-card.json" \
              > "$RUNNER_TEMP/card.json" 2>/dev/null; then
              echo "PASS official SDK native HTTPS Agent Card"
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/official-server.pid")" 2>/dev/null; then
              tail -n 60 "$RUNNER_TEMP/official-server.log"
              exit 1
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/card.json"
      - name: Run full native SDK rich Parts/Task/auth/tenant interop from installed RC
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_GEMFILE="$RUNNER_TEMP/isolated-interop-host/Gemfile" bundle exec ruby "$GITHUB_WORKSPACE/spikes/a2a_client_v03/official_sdk_native_https_probe.rb"
      - name: Show test-only server diagnostics on failure
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/official-server.log" || true
      - name: Stop test-only server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/official-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/official-server.pid")" 2>/dev/null || true
          fi

  installed-advisory:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["~> 8.0.0", "~> 8.1.0"]
    env:
      TARGET_RAILS: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: ${{ runner.temp }}/rc
      - name: Resolve the exact candidate locally and audit RubySec advisories
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          gem install --no-document "./$RC_FILENAME"
          gem install --no-document rails -v "$TARGET_RAILS"
          mkdir -p "$RUNNER_TEMP/stable-audit" "$RUNNER_TEMP/stable-audit-evidence"
          cat > "$RUNNER_TEMP/stable-audit/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "rails", "$TARGET_RAILS"
          gem "a2a-rails", "= $RC_VERSION"
          GEMFILE
          cd "$RUNNER_TEMP/stable-audit"
          bundle install --local
          bundle exec ruby -rbundler -e '
            require "rails"
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            abort "incorrect exact candidate" unless
              A2A::Rails::VERSION == "0.3.0" && spec.version.to_s == "0.3.0"
            abort "source checkout loaded" if File.realpath(spec.full_gem_path).start_with?(
              File.realpath(ENV.fetch("GITHUB_WORKSPACE")) + File::SEPARATOR
            )
            puts "PASS installed candidate Ruby #{RUBY_VERSION} Rails #{Rails.version}"
          ' | tee "$RUNNER_TEMP/stable-audit-evidence/installed.txt"
          cp Gemfile.lock "$RUNNER_TEMP/stable-audit-evidence/Gemfile.lock"
          sha256sum Gemfile.lock | tee "$RUNNER_TEMP/stable-audit-evidence/lockfile-SHA256SUMS"
          cp "$RUNNER_TEMP/rc/SHA256SUMS" "$RUNNER_TEMP/stable-audit-evidence/candidate-SHA256SUMS"
          cp "$RUNNER_TEMP/rc/SOURCE_COMMIT" "$RUNNER_TEMP/stable-audit-evidence/SOURCE_COMMIT"
          gem install --no-document bundler-audit
          bundle-audit version | tee "$RUNNER_TEMP/stable-audit-evidence/auditor-version.txt"
          bundle-audit check --update 2>&1 | tee "$RUNNER_TEMP/stable-audit-evidence/advisories.txt"
          echo "PASS: no matching known RubySec vulnerabilities in this resolved exact candidate host"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-audit-ruby-${{ matrix.ruby }}-rails-${{ matrix.rails == '~> 8.0.0' && '8-0' || '8-1' }}
          path: ${{ runner.temp }}/stable-audit-evidence/
          if-no-files-found: warn
          retention-days: 30

  installed-rails-echo:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      RACK_ENV: test
      RAILS_MAX_THREADS: "1"
      WEB_CONCURRENCY: "0"
      STEP29_5_DEMO_TLS_BASE: https://echo-agent.test:3443
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: ${{ runner.temp }}/rc
      - name: Install exactly the frozen 0.3.0 Gem into independent Client bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          gem install --no-document "./$RC_FILENAME"
          gem install --no-document rails -v "~> 8.1.0"
          mkdir -p "$RUNNER_TEMP/stable-client-host"
          cat > "$RUNNER_TEMP/stable-client-host/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "rails", "~> 8.1.0"
          gem "a2a-rails", "= 0.3.0"
          GEMFILE
          BUNDLE_GEMFILE="$RUNNER_TEMP/stable-client-host/Gemfile" bundle install --local
      - name: Independently install pinned published 0.2.0 Rails Echo Server
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/cuichangquan/a2a-rails-demo.git "$RUNNER_TEMP/a2a-rails-demo"
          git -C "$RUNNER_TEMP/a2a-rails-demo" checkout -q --detach 7cb002a63d6cc976b1562ee45e8a260771d7ef1d
          test "$(git -C "$RUNNER_TEMP/a2a-rails-demo" rev-parse HEAD)" = "7cb002a63d6cc976b1562ee45e8a260771d7ef1d"
          BUNDLE_GEMFILE="$RUNNER_TEMP/a2a-rails-demo/Gemfile" bundle install --jobs 4 --retry 3
          BUNDLE_GEMFILE="$RUNNER_TEMP/a2a-rails-demo/Gemfile" bundle exec ruby -rbundler -e '
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            source = Bundler.load.specs.find { |s| s.name == "a2a-rails" }.source
            abort "Server not published stable 0.2.0" unless
              spec.version.to_s == "0.2.0" && source.is_a?(Bundler::Source::Rubygems)
            puts "PASS independent Server uses published RubyGems 0.2.0"
          '
      - name: Start Rails Server listening on loopback HTTP only
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/a2a-rails-demo"
            BUNDLE_GEMFILE="$RUNNER_TEMP/a2a-rails-demo/Gemfile" bundle exec rails server -b 127.0.0.1 -p 3000
          ) > "$RUNNER_TEMP/stable-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/stable-server.pid"
          for n in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:3000/.well-known/agent-card.json > /dev/null 2>&1; then
              echo "PASS published Server loopback Card"
              exit 0
            fi
            sleep 1
          done
          tail -n 45 "$RUNNER_TEMP/stable-server.log"
          exit 1
      - name: Start local test-only TLS bridge with ephemeral verified certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/stable-tls.key" -out "$RUNNER_TEMP/stable-tls.crt" \
            -subj "/CN=echo-agent.test" -addext "subjectAltName=DNS:echo-agent.test" >/dev/null 2>&1
          echo "STEP29_5_DEMO_TLS_CA=$RUNNER_TEMP/stable-tls.crt" >> "$GITHUB_ENV"
          python3 spikes/a2a_client_v03/independent_demo_https_bridge.py \
            --certificate "$RUNNER_TEMP/stable-tls.crt" --key "$RUNNER_TEMP/stable-tls.key" \
            --port 3443 > "$RUNNER_TEMP/stable-tls-bridge.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/stable-tls-bridge.pid"
          for n in $(seq 1 50); do
            if curl --noproxy '*' -fsS --cacert "$RUNNER_TEMP/stable-tls.crt" \
              --resolve echo-agent.test:3443:127.0.0.1 \
              https://echo-agent.test:3443/.well-known/agent-card.json > "$RUNNER_TEMP/stable-card.json" 2>/dev/null; then
              echo "PASS temporary TLS bridge Card"
              exit 0
            fi
            sleep 1
          done
          tail -n 45 "$RUNNER_TEMP/stable-tls-bridge.log"
          exit 1
      - name: Call published 0.2.0 Rails Server from exact installed 0.3.0 Client over TLS
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_GEMFILE="$RUNNER_TEMP/stable-client-host/Gemfile" bundle exec ruby \
            "$GITHUB_WORKSPACE/test/support/step31_stable_candidate_echo.rb"
      - name: Limited logs on failure
        if: failure()
        shell: bash
        run: |
          tail -n 35 "$RUNNER_TEMP/stable-server.log" 2>/dev/null || true
          tail -n 25 "$RUNNER_TEMP/stable-tls-bridge.log" 2>/dev/null || true
      - name: Stop test-only processes
        if: always()
        shell: bash
        run: |
          for name in stable-tls-bridge stable-server; do
            if test -f "$RUNNER_TEMP/$name.pid"; then
              kill "$(cat "$RUNNER_TEMP/$name.pid")" 2>/dev/null || true
            fi
          done
