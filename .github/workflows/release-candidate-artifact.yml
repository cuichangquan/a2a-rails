name: Stable 0.2.0 exact artifact verification

on:
  push:
    branches: [main]
    paths:
      - "a2a-rails.gemspec"
      - "lib/**"
      - "app/**"
      - "config/**"
      - "test/**"
      - ".github/workflows/release-candidate-artifact.yml"
      - "spikes/clean_host_postgres/**"
      - "spikes/published_gem_postgres/probe.rb"
      - "docs/release/**"
      - "CHANGELOG.md"
      - "README.md"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "a2a-rails.gemspec"
      - "lib/**"
      - "app/**"
      - "config/**"
      - "test/**"
      - ".github/workflows/release-candidate-artifact.yml"
      - "spikes/clean_host_postgres/**"
      - "spikes/published_gem_postgres/probe.rb"
      - "docs/release/**"
      - "CHANGELOG.md"
      - "README.md"
      - "ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"

      - name: Build and verify exact candidate Gem
        shell: bash
        env:
          PACKAGED_GEM_EXPECTED_VERSION: "0.2.0"
          PACKAGED_RAILS_VERSION: "~> 8.1.0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc"
          PACKAGED_GEM_OUTPUT_DIR="$RUNNER_TEMP/rc"             ruby test/support/packaged_gem_smoke.rb

          gem_path="$RUNNER_TEMP/rc/a2a-rails-0.2.0.gem"
          test -f "$gem_path"

          (
            cd "$RUNNER_TEMP/rc"
            sha256sum "a2a-rails-0.2.0.gem" | tee SHA256SUMS
          )

          ruby -rrubygems/package -e '
            path = ARGV.fetch(0)
            spec = Gem::Package.new(path).spec
            abort "wrong name" unless spec.name == "a2a-rails"
            abort "wrong version: #{spec.version}" unless spec.version.to_s == "0.2.0"
            puts "Candidate package metadata: #{spec.name} #{spec.version}"
          ' "$gem_path"

      - name: Upload exact candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: a2a-rails-0.2.0-candidate
          path: |
            ${{ runner.temp }}/rc/a2a-rails-0.2.0.gem
            ${{ runner.temp }}/rc/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  installed-artifact-security:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rails:
          - "~> 8.0.0"
          - "~> 8.1.0"
    env:
      TARGET_RAILS: ${{ matrix.rails }}
      A2A_RAILS_EXPECTED_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"

      - name: Download the exact candidate built by build-candidate
        uses: actions/download-artifact@v4
        with:
          name: a2a-rails-0.2.0-candidate
          path: ${{ runner.temp }}/rc

      - name: Verify candidate SHA256 before installation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS

      - name: Install candidate and selected Rails into a clean bundle
        shell: bash
        run: |
          set -euo pipefail
          gem_path="$RUNNER_TEMP/rc/a2a-rails-0.2.0.gem"

          gem install --no-document "$gem_path"
          gem install --no-document rails -v "$TARGET_RAILS"

          host="$RUNNER_TEMP/clean-host"
          mkdir -p "$host"
          cat > "$host/Gemfile" <<GEMFILE
          source "https://rubygems.org"

          gem "rails", "$TARGET_RAILS"
          gem "a2a-rails", "= 0.2.0"
          GEMFILE

          BUNDLE_GEMFILE="$host/Gemfile" bundle install --local

          BUNDLE_GEMFILE="$host/Gemfile" bundle exec ruby -e '
            require "rails"
            require "a2a-rails"
            abort "unexpected Gem version" unless A2A::Rails::VERSION == "0.2.0"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            source = File.realpath(ENV.fetch("GITHUB_WORKSPACE"))
            loaded = File.realpath(spec.full_gem_path)
            abort "loaded source checkout instead of installed Gem" if loaded.start_with?(source + File::SEPARATOR)
            puts "Installed candidate: #{loaded}"
            puts "Rails under test: #{Rails.version}"
          '

      - name: Run production-shaped security smoke against installed candidate
        shell: bash
        env:
          RAILS_ENV: production
          RACK_ENV: production
          A2A_RAILS_USE_INSTALLED_GEM: "1"
          A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/clean-host"
          BUNDLE_GEMFILE="$host/Gemfile"             bundle exec ruby "$GITHUB_WORKSPACE/test/support/production_security_http_smoke.rb"

      - name: Verify signed test-issuer tokens, fail-closed auth and tenant isolation
        shell: bash
        env:
          RAILS_ENV: production
          RACK_ENV: production
          A2A_RAILS_USE_INSTALLED_GEM: "1"
          A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/clean-host"
          BUNDLE_GEMFILE="$host/Gemfile" bundle exec ruby "$GITHUB_WORKSPACE/test/support/installed_auth_isolation_smoke.rb"

  installed-artifact-clean-postgres:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 8.0.0", "~> 8.1.0"]
        inflection: ["default", "acronym"]
    env:
      TARGET_RAILS: ${{ matrix.rails }}
      A2A_TEST_INFLECTION: ${{ matrix.inflection }}
      A2A_RAILS_EXPECTED_VERSION: "0.2.0"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/a2a_rails_test
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: issue-65-clean-production-smoke-test-only
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Start preinstalled PostgreSQL 16 on Ubuntu 24.04 runner
        shell: bash
        run: |
          set -euo pipefail
          pg_config --version
          pg_config --version | grep -Eq '^PostgreSQL 16[.]'
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='a2a_rails_test'" | grep -qx 1; then
            sudo -u postgres createdb a2a_rails_test
          fi
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=a2a_rails_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          pg_isready -h 127.0.0.1 -U postgres -d a2a_rails_test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - uses: actions/download-artifact@v4
        with:
          name: a2a-rails-0.2.0-candidate
          path: ${{ runner.temp }}/rc
      - name: Verify the same exact candidate used by release verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          sha256sum -c SHA256SUMS
          echo "CANDIDATE_GEM_SHA256=$(sha256sum a2a-rails-0.2.0.gem | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          gem install --no-document "$RUNNER_TEMP/rc/a2a-rails-0.2.0.gem"
          gem install --no-document rails -v "$TARGET_RAILS"
          pg_config --version
      - name: Verify clean production Rails host (no patch), migration, HTTP and DB durability
        shell: bash
        env:
          CANDIDATE_GEM_FILE: ${{ runner.temp }}/rc/a2a-rails-0.2.0.gem
        run: ruby spikes/clean_host_postgres/smoke.rb
