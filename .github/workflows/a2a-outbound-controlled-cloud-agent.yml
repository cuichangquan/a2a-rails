name: Step 29-5c controlled Cloud Run Python Echo artifact

on:
  pull_request:
    paths:
      - ".github/workflows/a2a-outbound-controlled-cloud-agent.yml"
      - "spikes/a2a_client_v03/controlled_public_echo/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/a2a-outbound-controlled-cloud-agent.yml"
      - "spikes/a2a_client_v03/controlled_public_echo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-bootstrap-and-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official SDK and local test client
        working-directory: spikes/a2a_client_v03/controlled_public_echo
        run: |
          python -m pip install -r requirements.txt "httpx==0.28.1"
      - name: Compile and exercise original Agent Card / A2A v1.0 RPC locally
        working-directory: spikes/a2a_client_v03/controlled_public_echo
        run: |
          python -m compileall -q app.py test_app.py
          python -m unittest -v test_app
      - name: Build deployment artifact without deploying a public service
        working-directory: spikes/a2a_client_v03/controlled_public_echo
        run: |
          docker build --pull -t a2a-step29-5c-controlled-echo:ci .
