name: Published rc2 PostgreSQL host smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/published-gem-postgres.yml"
      - "spikes/published_gem_postgres/**"
      - "docs/release/**"
  pull_request:
    paths:
      - ".github/workflows/published-gem-postgres.yml"
      - "spikes/published_gem_postgres/**"
      - "docs/release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-postgres-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 8.0.0", "~> 8.1.0"]


    env:
      TARGET_RAILS: ${{ matrix.rails }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/a2a_rails_test
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: step-26-1-isolated-ci-host-secret-key-base-not-for-production
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"

    steps:
      - uses: actions/checkout@v4
      - name: Start preinstalled PostgreSQL 16 on Ubuntu 24.04 runner
        shell: bash
        run: |
          set -euo pipefail
          pg_config --version
          pg_config --version | grep -Eq '^PostgreSQL 16[.]'
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='a2a_rails_test'" | grep -qx 1; then
            sudo -u postgres createdb a2a_rails_test
          fi
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=a2a_rails_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          pg_isready -h 127.0.0.1 -U postgres -d a2a_rails_test


      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"

      - name: Fetch the published RubyGems artifact and verify its approved SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gem fetch a2a-rails -v 0.2.0.rc2 --clear-sources --source https://rubygems.org
          echo "d65fdd65003987ece96f0a90a4cf28563929be99d26658deeb275fca30c5d694  a2a-rails-0.2.0.rc2.gem" | sha256sum -c -
          gem install --no-document ./a2a-rails-0.2.0.rc2.gem
          gem install --no-document rails -v "$TARGET_RAILS"
          ruby -rrubygems -e 'abort "not installed" unless Gem::Specification.find_all_by_name("a2a-rails", "= 0.2.0.rc2").any?'
          pg_config --version

      - name: Run clean DB-backed Rails host migration, HTTP, restart and prune smoke
        shell: bash
        env:
          PUBLISHED_GEM_FILE: ${{ runner.temp }}/a2a-rails-0.2.0.rc2.gem
          A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
        run: ruby spikes/published_gem_postgres/smoke.rb
