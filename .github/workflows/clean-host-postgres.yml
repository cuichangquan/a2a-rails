name: Issue 65 clean production Rails host

on:
  pull_request:
    paths:
      - "lib/a2a/rails/engine.rb"
      - "lib/generators/a2a/rails/**"
      - "spikes/clean_host_postgres/**"
      - "spikes/published_gem_postgres/probe.rb"
      - ".github/workflows/clean-host-postgres.yml"
  push:
    branches: [main]
    paths:
      - "lib/a2a/rails/engine.rb"
      - "lib/generators/a2a/rails/**"
      - "spikes/clean_host_postgres/**"
      - "spikes/published_gem_postgres/probe.rb"
      - ".github/workflows/clean-host-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exact-source-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - name: Build source artifact (NOT a RubyGems publication)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new-gem"
          gem build a2a-rails.gemspec --output "$RUNNER_TEMP/new-gem/a2a-rails-0.2.0.rc2.gem"
          cd "$RUNNER_TEMP/new-gem"
          sha256sum a2a-rails-0.2.0.rc2.gem | tee SHA256SUMS
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV.fetch(0)).spec
            abort "wrong version" unless spec.name == "a2a-rails" && spec.version.to_s == "0.2.0.rc2"
          ' a2a-rails-0.2.0.rc2.gem
      - uses: actions/upload-artifact@v4
        with:
          name: issue-65-source-built-gem
          path: |
            ${{ runner.temp }}/new-gem/a2a-rails-0.2.0.rc2.gem
            ${{ runner.temp }}/new-gem/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  clean-host-postgres:
    needs: build-exact-source-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 8.0.0", "~> 8.1.0"]
        inflection: ["default", "acronym"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a2a_rails_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a2a_rails_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TARGET_RAILS: ${{ matrix.rails }}
      A2A_TEST_INFLECTION: ${{ matrix.inflection }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/a2a_rails_test
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: issue-65-generated-rails-fixture-test-key-only-not-production
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      A2A_RAILS_SOURCE_ROOT: ${{ github.workspace }}
      CANDIDATE_GEM_FILE: ${{ runner.temp }}/new-gem/a2a-rails-0.2.0.rc2.gem

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - uses: actions/download-artifact@v4
        with:
          name: issue-65-source-built-gem
          path: ${{ runner.temp }}/new-gem
      - name: Verify and install exactly the source-built artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/new-gem"
          sha256sum -c SHA256SUMS
          echo "CANDIDATE_GEM_SHA256=$(sha256sum a2a-rails-0.2.0.rc2.gem | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          gem install --no-document "$CANDIDATE_GEM_FILE"
          gem install --no-document rails -v "$TARGET_RAILS"
          pg_config --version
      - name: Verify clean production Rails host + migrations + Task durability
        shell: bash
        run: ruby spikes/clean_host_postgres/smoke.rb
